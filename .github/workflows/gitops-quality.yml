name: GitOps release quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.5'
      - name: Install YAML library
        run: python -m pip install PyYAML==6.0.3
      - name: Render all candidate environments
        run: python scripts/validate_release.py
      - name: Verify release safety invariants
        run: python -m unittest discover -s tests -v
