apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-app
  namespace: devops-demo
  labels:
    app: cloud-app

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: cloud-app

  template:
    metadata:
      labels:
        app: cloud-app

    spec:
      containers:
        - name: cloud-app
          image: alexcgodwin/cloud-app:5
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
